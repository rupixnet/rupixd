name: Build and upload assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Building, ${{ matrix.os }}
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid= -extldflags=-static" -tags netgo,osusergo -o ./bin/ .
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid= -extldflags=-static" -tags netgo,osusergo -o ./bin/ ./cmd/rupixctl ./cmd/rupixwallet ./cmd/rupixminer
          archive="rupix-${{ github.event.release.tag_name }}-linux.zip"
          zip -r -j "${archive}" ./bin/*
          sha256sum "${archive}" > "${archive}.sha256"
          (cd bin && sha256sum *) > SHA256SUMS-linux.txt
          echo "archive=${archive}" >> $GITHUB_ENV
          echo "sums=SHA256SUMS-linux.txt" >> $GITHUB_ENV
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o bin/ .
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o bin/ ./cmd/rupixctl ./cmd/rupixwallet ./cmd/rupixminer
          archive="rupix-${{ github.event.release.tag_name }}-win64.zip"
          powershell "Compress-Archive bin/* \"${archive}\""
          sha256sum "${archive}" > "${archive}.sha256"
          (cd bin && sha256sum *) > SHA256SUMS-win64.txt
          echo "archive=${archive}" >> $GITHUB_ENV
          echo "sums=SHA256SUMS-win64.txt" >> $GITHUB_ENV
      - name: Build on MacOS
        if: runner.os == 'macOS'
        run: |
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ./bin/ .
          go build -v -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ./bin/ ./cmd/rupixctl ./cmd/rupixwallet ./cmd/rupixminer
          archive="rupix-${{ github.event.release.tag_name }}-osx.zip"
          zip -r -j "${archive}" ./bin/*
          shasum -a 256 "${archive}" > "${archive}.sha256"
          (cd bin && shasum -a 256 *) > SHA256SUMS-osx.txt
          echo "archive=${archive}" >> $GITHUB_ENV
          echo "sums=SHA256SUMS-osx.txt" >> $GITHUB_ENV
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
            ${{ env.sums }}
