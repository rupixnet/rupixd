name: Race
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  race:
    runs-on: ubuntu-latest
    name: Race detection on main
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Test with race detector
        run: go test -timeout 30m -race ./...
